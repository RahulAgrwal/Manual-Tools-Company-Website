<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MTC logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MTC</title>
  <!-- red badge -->
  <circle cx="128" cy="128" r="120" fill="#FF0000"/>
  <!-- white separating ring (inner edge 100, outer edge 106) -->
  <circle cx="128" cy="128" r="103" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <g fill="#FFFFFF">
    <!-- M : flat tops, flat stem feet, diagonals meeting in a soft rounded vertex -->
    <path d="M53.91,92.27 L68.72,92.27 L87.61,164.22 L107.59,92.27 L121.17,92.27 L121.17,184.62 L112.17,184.62 L112.17,108.18 L91.66,182.04 A4.35,4.35 0 0,1 83.27,181.99 L62.91,104.42 L62.91,184.62 L53.91,184.62 Z"/>
    <!-- T : cross-bar over the M, stem dropping past the baseline -->
    <path d="M60.71,75.03 h137.72 v9.0 h-60.36 v128.23 h-9.0 v-128.23 h-68.36 Z"/>
    <!-- C : open elliptical ring with horizontal terminals -->
    <path d="M211.07,117.01 A34.15,48.57 0 1,0 210.98,162.06 H198.75 A23.85,34.47 0 1,1 198.89,117.01 Z"/>
  </g>
</svg>
